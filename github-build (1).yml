name: Build CsdprbsMc Essentials

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Extract project ZIP
        shell: bash
        run: |
          ZIP_FILE="$(find . -type f -name '*.zip' -not -path './.git/*' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Nenhum arquivo ZIP foi encontrado no repositório."
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          BUILD_FILE="$(find extracted -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) | head -n 1)"
          if [ -z "$BUILD_FILE" ]; then
            echo "O ZIP não contém build.gradle ou build.gradle.kts."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - name: Compile plugin
        run: gradle --no-daemon clean build
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CsdprbsMcEssentials-1.1.1
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
